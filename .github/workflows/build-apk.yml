name: Build APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布版本号，例如 time-1"
        required: true
        default: "time-1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 生成 google-services.json 空壳
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": { "project_number": "000000000000", "project_id": "placeholder", "storage_bucket": "placeholder.appspot.com" },
            "client": [
              { "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000", "android_client_info": { "package_name": "me.rerere.rikkahub.jude" } }, "api_key": [ { "current_key": "placeholder" } ] },
              { "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000000001", "android_client_info": { "package_name": "me.rerere.rikkahub.jude.debug" } }, "api_key": [ { "current_key": "placeholder" } ] }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: 打包
        run: ./gradlew assemblePublicDebug --no-daemon --stacktrace

      - name: 找到 APK
        run: find app/build/outputs/apk -name "*.apk" | tee apks.txt

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(grep -i universal apks.txt | head -1)
          cp "$APK" app-public-universal-debug.apk
          gh release create "${{ inputs.tag }}" app-public-universal-debug.apk \
            --title "${{ inputs.tag }} 每条消息带时间戳" \
            --notes "每条用户消息开头自动带上发送时间和距上一条消息的间隔（需在助手设置里打开「时间提醒」）。"
